name: Sync Garmin Data

on:
  schedule:
    - cron: '0 4 * * *' # Si avvia da solo ogni giorno alle 04:00 UTC
  workflow_dispatch: # Ti permette di avviarlo manualmente con un click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install garminconnect

      - name: Fetch Data from Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add garmin_data.json
          git commit -m "Auto-update Garmin Data" || exit 0
          git push
