name: Aggiorna dati Garmin

on:
  schedule:
    - cron: "0 */3 * * *"   # ogni 3 ore
  workflow_dispatch:         # permette di lanciarlo a mano dal sito GitHub

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ripristina i dati gia scaricati
        uses: actions/cache@v4
        with:
          path: data
          key: garmin-data-${{ github.run_id }}
          restore-keys: garmin-data-

      - name: Scarica i dati da Garmin
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          TZ: Europe/Rome
        run: python fetch_data.py

      - name: Togli il token dalla copia salvata
        run: rm -f data/token.json

      - name: Salva il file aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garmin_data.json
          if [ -d dettagli ]; then git add dettagli; fi
          if git diff --cached --quiet; then
            echo "Nessuna novita"
          else
            git commit -m "Aggiornamento dati Garmin"
            git pull --rebase
            git push
          fi
