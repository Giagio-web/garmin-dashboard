<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Running Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .card h3 {
            margin: 0;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f35627;
            margin-top: 5px;
        }
        .chart-container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃‍♂️ Garmin Running Dashboard</h1>
        
        <div class="stats-grid">
            <div class="card">
                <h3>Ultima Corsa</h3>
                <div class="value" id="last-dist">- km</div>
            </div>
            <div class="card">
                <h3>FC Media</h3>
                <div class="value" id="last-hr">- bpm</div>
            </div>
            <div class="card">
                <h3>Potenza Media</h3>
                <div class="value" id="last-power">- W</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="hrChart"></canvas>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            const response = await fetch('garmin_data.json');
            const data = await response.json();
            
            // Ordina dal meno recente al più recente per il grafico
            const sortedData = data.slice().reverse();

            if (data.length > 0) {
                const latest = data[0];
                document.getElementById('last-dist').innerText = `${latest.distance_km} km`;
                document.getElementById('last-hr').innerText = `${latest.avg_hr || '-'} bpm`;
                document.getElementById('last-power').innerText = `${latest.avg_power || '-'} W`;
            }

            const labels = sortedData.map(d => new Date(d.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
            const hrData = sortedData.map(d => d.avg_hr);
            const distData = sortedData.map(d => d.distance_km);

            const ctx = document.getElementById('hrChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'FC Media (bpm)',
                            data: hrData,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            yAxisID: 'y1',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'Distanza (km)',
                            data: distData,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.1)',
                            yAxisID: 'y2',
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'BPM', color: '#ef4444' },
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        y2: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: 'Km', color: '#38bdf8' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc' } }
                    }
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
